<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selenium 2 Playwright | B.L.A.S.T. Converter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <div class="app">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="nav-brand">
                <div class="logo">
                    <i class="ph ph-lightning-fill"></i>
                </div>
                <div class="brand-text">
                    <h1>Selenium <span class="arrow">→</span> Playwright</h1>
                    <span class="tagline">B.L.A.S.T. Converter</span>
                </div>
            </div>
            <div class="nav-meta">
                <div class="powered-by">
                    <span class="meta-label">Powered by</span>
                    <span class="meta-value">Local LLM</span>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Toolbar -->
            <div class="toolbar">
                <div class="toolbar-section">
                    <span class="toolbar-label">Target Language</span>
                    <!-- Language Toggle Switch -->
                    <div class="language-toggle" role="radiogroup" aria-label="Select target language">
                        <label class="toggle-option" :class="{ active: currentLang === 'typescript' }">
                            <input type="radio" name="language" value="typescript" checked onchange="updateLanguage('typescript')">
                            <span class="toggle-content">
                                <i class="ph ph-file-tsx"></i>
                                <span class="lang-name">TypeScript</span>
                                <span class="lang-ext">.spec.ts</span>
                            </span>
                        </label>
                        <label class="toggle-option" :class="{ active: currentLang === 'javascript' }">
                            <input type="radio" name="language" value="javascript" onchange="updateLanguage('javascript')">
                            <span class="toggle-content">
                                <i class="ph ph-file-js"></i>
                                <span class="lang-name">JavaScript</span>
                                <span class="lang-ext">.spec.js</span>
                            </span>
                        </label>
                    </div>
                </div>
                
                <div class="toolbar-section">
                    <button id="convertBtn" class="convert-btn" onclick="convertCode()">
                        <div class="btn-content">
                            <i class="ph ph-arrows-left-right"></i>
                            <span>Convert Code</span>
                        </div>
                        <div id="loader" class="spinner hidden"></div>
                    </button>
                </div>
            </div>

            <!-- Editor Area -->
            <div class="editor-container">
                <!-- Input Panel -->
                <div class="editor-panel input-panel">
                    <div class="panel-header">
                        <div class="panel-title">
                            <div class="file-icon java-icon">
                                <i class="ph ph-coffee"></i>
                            </div>
                            <div class="title-group">
                                <h2>Input</h2>
                                <span class="file-type">Java / Selenium / TestNG</span>
                            </div>
                        </div>
                        <div class="panel-actions">
                            <button class="action-btn" onclick="clearInput()" title="Clear">
                                <i class="ph ph-trash"></i>
                            </button>
                            <button class="action-btn" onclick="loadExample()" title="Load Example">
                                <i class="ph ph-code"></i>
                            </button>
                        </div>
                    </div>
                    <div class="editor-wrapper">
                        <div class="line-numbers" id="inputLines">1</div>
                        <textarea 
                            id="javaCode" 
                            placeholder="// Paste your Selenium Java code here...&#10;// Example:&#10;WebDriver driver = new ChromeDriver();&#10;driver.get(&quot;https://example.com&quot;);"
                            spellcheck="false"
                            oninput="updateLineNumbers('inputLines', this)"
                            onscroll="syncScroll(this, 'inputLines')"
                        ></textarea>
                    </div>
                    <div class="panel-footer">
                        <span class="char-count" id="inputStats">0 chars | 0 lines</span>
                    </div>
                </div>

                <!-- Divider with Action -->
                <div class="editor-divider">
                    <div class="divider-line"></div>
                    <button class="swap-btn" onclick="swapCode()" title="Swap code">
                        <i class="ph ph-arrows-horizontal"></i>
                    </button>
                    <div class="divider-line"></div>
                </div>

                <!-- Output Panel -->
                <div class="editor-panel output-panel">
                    <div class="panel-header">
                        <div class="panel-title">
                            <div class="file-icon ts-icon" id="outputIcon">
                                <i class="ph ph-file-tsx"></i>
                            </div>
                            <div class="title-group">
                                <h2>Output</h2>
                                <span class="file-type" id="outputType">TypeScript / Playwright</span>
                            </div>
                        </div>
                        <div class="panel-actions">
                            <button class="action-btn" onclick="copyOutput()" title="Copy to Clipboard">
                                <i class="ph ph-copy"></i>
                            </button>
                            <button class="action-btn" onclick="saveCode()" title="Save to File">
                                <i class="ph ph-download-simple"></i>
                            </button>
                        </div>
                    </div>
                    <div class="editor-wrapper">
                        <div class="line-numbers" id="outputLines">1</div>
                        <textarea 
                            id="tsCode" 
                            readonly 
                            placeholder="// Converted Playwright code will appear here..."
                            spellcheck="false"
                            onscroll="syncScroll(this, 'outputLines')"
                        ></textarea>
                    </div>
                    <div class="panel-footer">
                        <span class="char-count" id="outputStats">0 chars | 0 lines</span>
                        <span class="status-indicator" id="statusIndicator">
                            <i class="ph ph-circle"></i>
                            Ready
                        </span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Status Bar -->
        <footer class="status-bar">
            <div class="status-left">
                <span class="status-item" id="connectionStatus">
                    <i class="ph ph-wifi-high"></i>
                    Connected
                </span>
                <span class="status-separator">|</span>
                <span class="status-item" id="modelStatus">
                    <i class="ph ph-brain"></i>
                    CodeLlama
                </span>
            </div>
            <div class="status-center" id="statusMessage">
                Ready to convert
            </div>
            <div class="status-right">
                <span class="status-item">
                    <i class="ph ph-info"></i>
                    v1.0.0
                </span>
            </div>
        </footer>
    </div>

    <script>
        let currentLang = 'typescript';

        function updateLanguage(lang) {
            currentLang = lang;
            
            // Update toggle visual state
            document.querySelectorAll('.toggle-option').forEach(option => {
                option.classList.remove('active');
            });
            event.target.closest('.toggle-option').classList.add('active');
            
            // Update output panel UI
            const outputIcon = document.getElementById('outputIcon');
            const outputType = document.getElementById('outputType');
            
            if (lang === 'typescript') {
                outputIcon.innerHTML = '<i class="ph ph-file-tsx"></i>';
                outputIcon.className = 'file-icon ts-icon';
                outputType.textContent = 'TypeScript / Playwright';
            } else {
                outputIcon.innerHTML = '<i class="ph ph-file-js"></i>';
                outputIcon.className = 'file-icon js-icon';
                outputType.textContent = 'JavaScript / Playwright';
            }
            
            updateStatus('Language changed to ' + (lang === 'typescript' ? 'TypeScript' : 'JavaScript'), 'info');
        }

        function updateLineNumbers(elementId, textarea) {
            const lines = textarea.value.split('\n').length;
            const lineNumbers = document.getElementById(elementId);
            lineNumbers.innerHTML = Array(lines).fill(0).map((_, i) => i + 1).join('\n');
            
            // Update stats
            const statsId = elementId === 'inputLines' ? 'inputStats' : 'outputStats';
            document.getElementById(statsId).textContent = `${textarea.value.length} chars | ${lines} lines`;
        }

        function syncScroll(textarea, lineNumbersId) {
            document.getElementById(lineNumbersId).scrollTop = textarea.scrollTop;
        }

        function updateStatus(message, type = 'info') {
            const statusMessage = document.getElementById('statusMessage');
            const statusIndicator = document.getElementById('statusIndicator');
            
            statusMessage.textContent = message;
            statusMessage.className = 'status-center ' + type;
            
            if (type === 'processing') {
                statusIndicator.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Processing...';
                statusIndicator.className = 'status-indicator processing';
            } else if (type === 'success') {
                statusIndicator.innerHTML = '<i class="ph ph-check-circle"></i> Done';
                statusIndicator.className = 'status-indicator success';
            } else if (type === 'error') {
                statusIndicator.innerHTML = '<i class="ph ph-x-circle"></i> Error';
                statusIndicator.className = 'status-indicator error';
            } else {
                statusIndicator.innerHTML = '<i class="ph ph-circle"></i> Ready';
                statusIndicator.className = 'status-indicator';
            }
        }

        async function convertCode() {
            const javaCode = document.getElementById('javaCode').value;
            const btn = document.getElementById('convertBtn');
            const tsArea = document.getElementById('tsCode');

            if (!javaCode.trim()) {
                updateStatus('Please enter some Java code first', 'error');
                shakeElement(document.querySelector('.input-panel'));
                return;
            }

            // UI Loading State
            btn.disabled = true;
            btn.classList.add('loading');
            updateStatus(`Converting via Local LLM (${currentLang})...`, 'processing');

            try {
                const response = await fetch('/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        source_code: javaCode,
                        language: currentLang
                    })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    tsArea.value = data.converted_code;
                    updateLineNumbers('outputLines', tsArea);
                    updateStatus('Conversion completed successfully!', 'success');
                } else {
                    tsArea.value = "// Error: " + data.message;
                    updateStatus('Conversion failed: ' + data.message, 'error');
                }
            } catch (error) {
                tsArea.value = "// Network Error: " + error.message;
                updateStatus('Network error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        }

        async function saveCode() {
            const tsCode = document.getElementById('tsCode').value;
            if (!tsCode.trim()) {
                updateStatus('No code to save', 'error');
                return;
            }

            const ext = currentLang === 'typescript' ? '.spec.ts' : '.spec.js';
            const filename = prompt("Enter filename:", "converted_test" + ext);
            if (!filename) return;

            try {
                const response = await fetch('/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ converted_code: tsCode, filename: filename })
                });
                const data = await response.json();
                updateStatus('Saved to: ' + data.file_path, 'success');
            } catch (e) {
                updateStatus('Save failed: ' + e.message, 'error');
            }
        }

        function copyOutput() {
            const tsCode = document.getElementById('tsCode');
            if (!tsCode.value.trim()) {
                updateStatus('No code to copy', 'error');
                return;
            }
            
            tsCode.select();
            document.execCommand('copy');
            
            // Visual feedback
            const btn = event.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="ph ph-check"></i>';
            btn.classList.add('success');
            
            updateStatus('Copied to clipboard!', 'success');
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('success');
            }, 1500);
        }

        function clearInput() {
            document.getElementById('javaCode').value = '';
            updateLineNumbers('inputLines', document.getElementById('javaCode'));
            updateStatus('Input cleared', 'info');
        }

        function loadExample() {
            const example = `// Selenium Java TestNG Example
import org.openqa.selenium.WebDriver;
import org.openqa.selenium.chrome.ChromeDriver;
import org.testng.annotations.Test;

public class LoginTest {
    @Test
    public void testLogin() {
        WebDriver driver = new ChromeDriver();
        driver.get("https://example.com/login");
        
        // Find elements and interact
        driver.findElement(By.id("username")).sendKeys("testuser");
        driver.findElement(By.id("password")).sendKeys("password123");
        driver.findElement(By.cssSelector("button[type='submit']")).click();
        
        // Assertion
        Assert.assertTrue(driver.getTitle().contains("Dashboard"));
        driver.quit();
    }
}`;
            document.getElementById('javaCode').value = example;
            updateLineNumbers('inputLines', document.getElementById('javaCode'));
            updateStatus('Example loaded', 'info');
        }

        function swapCode() {
            const input = document.getElementById('javaCode');
            const output = document.getElementById('tsCode');
            
            if (!output.value.trim()) {
                updateStatus('No output to swap', 'error');
                return;
            }
            
            // Note: This is mainly visual since we can't convert back
            const temp = input.value;
            input.value = output.value;
            output.value = temp;
            
            updateLineNumbers('inputLines', input);
            updateLineNumbers('outputLines', output);
            updateStatus('Code swapped', 'info');
        }

        function shakeElement(element) {
            element.classList.add('shake');
            setTimeout(() => element.classList.remove('shake'), 500);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            updateLineNumbers('inputLines', document.getElementById('javaCode'));
            updateLineNumbers('outputLines', document.getElementById('tsCode'));
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                convertCode();
            }
        });
    </script>
</body>

</html>
